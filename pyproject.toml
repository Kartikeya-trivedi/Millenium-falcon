[project]
name = "millenium-falcon"
version = "0.1.0"
description = "Reproducible business record matching experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.2.6",
    "polars==1.44.2",
    "scipy==1.15.1",
    "scikit-learn==1.6.1",
    "lightgbm==4.7.0",
    "rapidfuzz==3.14.6",
    "anyascii==0.3.3",
    "sparse-dot-topn==1.2.0",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
package = false
